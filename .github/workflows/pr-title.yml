name: PR title

on:
  pull_request:
    types: [ opened, edited, reopened, synchronize ]

permissions:
  contents: read
jobs:
  check:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - name: Check title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|chore|docs|refactor|test|ci)(\([a-z0-9-]+\))?!?: .+$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must look like 'feat(core): add schema validation'"
            exit 1
          fi 
